  ];
  function seedItems(){ return SEED.map(function(r,i){ return {id:"s"+i,lane:r[0],d:r[1],t:{zh:r[2],en:r[4]},nt:{zh:r[3]||"",en:r[5]||""}}; }); }

  var KEY="layaThaiSchedule_v5", LKEY="layaThaiLanes_v5", GKEY="layaThaiLang";
  var lang=loadLang();
  var items=load(), hidden=loadLanes();
  function loadLang(){ try{ var s=localStorage.getItem(GKEY); if(s==="zh"||s==="en") return s; }catch(e){} return "zh"; }
  function saveLang(){ try{ localStorage.setItem(GKEY,lang); }catch(e){} }
  function load(){ try{ var s=localStorage.getItem(KEY); if(s){ var a=JSON.parse(s); if(Array.isArray(a)&&a.length) return a; } }catch(e){} return seedItems(); }
  function save(){ try{ localStorage.setItem(KEY,JSON.stringify(items)); }catch(e){} }
  function loadLanes(){ try{ var s=localStorage.getItem(LKEY); if(s) return JSON.parse(s)||{}; }catch(e){} return {}; }
  function saveLanes(){ try{ localStorage.setItem(LKEY,JSON.stringify(hidden)); }catch(e){} }

  var gbody=document.getElementById("gbody"), ghead=document.getElementById("ghead");
  var moveCancelBtn=document.getElementById("moveCancel");
  var editBtn=document.getElementById("editBtn"), copyBtn=document.getElementById("copyBtn"), resetBtn=document.getElementById("resetBtn"), exportBtn=document.getElementById("exportBtn");
  var editing=false, moving=null, dragId=null;

  function applyChrome(){
    var T=UI[lang];
    try{ document.documentElement.lang = (lang==="en"?"en":"zh-Hant"); }catch(e){}
    try{ document.title = T.docTitle; }catch(e){}
    document.getElementById("h1").innerHTML = T.title+' <span class="x">'+T.x+'</span>';
    document.getElementById("sub").textContent = T.sub;
    document.getElementById("rhythm").textContent = T.rhythm;
    document.getElementById("r1").textContent = T.r1;
    document.getElementById("r2").textContent = T.r2;
    document.getElementById("r3").textContent = T.r3;
    document.getElementById("moveHint").textContent = T.moveHint;
    document.getElementById("editHint").textContent = T.editHint;
    editBtn.textContent = T.edit; copyBtn.textContent = T.copy; resetBtn.textContent = T.reset; moveCancelBtn.textContent = T.cancel;
    exportBtn.textContent = T.exportJson; document.getElementById("srcNote").textContent = T.srcNote;
    Array.prototype.forEach.call(document.querySelectorAll("#langtabs button"),function(b){
      b.setAttribute("aria-pressed", b.dataset.lang===lang ? "true":"false");
    });
  }

  function renderHead(){
    var tr=document.createElement("tr");
    var corner=document.createElement("th"); corner.className="corner lanecol";
    var lab=document.createElement("div"); lab.className="dhead"; lab.style.borderBottom="none";
    lab.innerHTML='<span class="wk" style="font-weight:800;color:var(--muted)">'+UI[lang].corner+'</span>';
    corner.appendChild(lab); tr.appendChild(corner);
    DAYS.forEach(function(d){
      var th=document.createElement("th"); th.className="daycol";
      var p=phaseOf(d);
      th.innerHTML='<div class="dhead"><span class="d">12/'+d+'</span> <span class="wk">('+wkOf(d)+')</span>'+
        '<br><span class="ph" style="background:'+phaseColor(p)+'">'+phaseLabel(p)+'</span></div>';
      tr.appendChild(th);
    });
    ghead.innerHTML=""; ghead.appendChild(tr);
  }

  function moveItem(id,laneId,day){
    var o=items.find(function(x){return x.id===id;}); if(!o) return;
    o.lane=laneId; o.d=day; moving=null; dragId=null; save(); render();
  }

  function cardEl(it){
    var lane=laneOf(it.lane);
    var c=document.createElement("div"); c.className="card"; c.style.borderLeftColor=lane?lane.color:"var(--line)";
    c.dataset.id=it.id;
    if(moving===it.id) c.classList.add("sel-move");

    var mv=document.createElement("button"); mv.className="mv"; mv.type="button"; mv.textContent="⇅";
    mv.addEventListener("click",function(e){ e.stopPropagation(); moving=(moving===it.id)?null:it.id; applyMoveState(); });

    c.setAttribute("draggable", editing?"false":"true");
    c.addEventListener("dragstart",function(e){ moving=null; dragId=it.id; c.classList.add("dragging");
      try{ e.dataTransfer.setData("text/plain",it.id); e.dataTransfer.effectAllowed="move"; }catch(_){} });
    c.addEventListener("dragend",function(){ c.classList.remove("dragging"); dragId=null; clearHot(); });

    var t=document.createElement("div"); t.className="t"; t.textContent=it.t[lang]||""; t.dataset.f="t";
    var n=document.createElement("div"); n.className="nt"; n.textContent=it.nt[lang]||""; n.dataset.f="nt";
    if(!(it.nt[lang]) && !editing) n.style.display="none";
    var rm=document.createElement("button"); rm.className="rm"; rm.textContent="✕";
    rm.addEventListener("click",function(){ items=items.filter(function(x){return x.id!==it.id;}); save(); render(); });
    c.appendChild(mv); c.appendChild(rm); c.appendChild(t); c.appendChild(n);
    [t,n].forEach(function(el){
      el.addEventListener("blur",function(){
        var obj=items.find(function(x){return x.id===it.id;}); if(!obj) return;
        obj[el.dataset.f][lang]=el.textContent.trim(); save();
      });
    });
    return c;
  }

  function clearHot(){ gbody.querySelectorAll("td.drop-hot").forEach(function(td){ td.classList.remove("drop-hot"); }); }

  function render(){
    renderHead();
    gbody.innerHTML="";
    LANES.forEach(function(lane){
      var tr=document.createElement("tr"); if(hidden[lane.id]) tr.className="lane-hidden";
      var lc=document.createElement("td"); lc.className="lanecol lanelabel";
      lc.innerHTML='<div class="nm"><span class="bar" style="background:'+lane.color+'"></span>'+laneName(lane)+'</div><div class="role">'+laneRole(lane)+'</div>';
      tr.appendChild(lc);
      DAYS.forEach(function(d){
        var td=document.createElement("td"); td.className="cell daycol"; td.dataset.lane=lane.id; td.dataset.day=d;
        var dz=document.createElement("button"); dz.className="dropzone"; dz.type="button";
        dz.textContent=UI[lang].dropTo(d,laneShort(lane));
        dz.addEventListener("click",function(){ if(moving) moveItem(moving,lane.id,d); });
        td.appendChild(dz);
        items.filter(function(it){return it.lane===lane.id && it.d===d;}).forEach(function(it){ td.appendChild(cardEl(it)); });
        var add=document.createElement("button"); add.className="add"; add.textContent=UI[lang].add;
        add.addEventListener("click",function(){
          var it={id:"u"+Date.now()+Math.floor(Math.random()*99),lane:lane.id,d:d,
            t:{zh:UI.zh.newItem,en:UI.en.newItem},nt:{zh:"",en:""}};
          items.push(it); save(); render();
          setTimeout(function(){
            var card=gbody.querySelector('[data-id="'+it.id+'"] .t');
            if(card){ card.focus(); document.getSelection().selectAllChildren(card); }
          },0);
        });
        td.appendChild(add);
        td.addEventListener("dragover",function(e){ if(dragId){ e.preventDefault(); e.dataTransfer.dropEffect="move"; td.classList.add("drop-hot"); } });
        td.addEventListener("dragleave",function(){ td.classList.remove("drop-hot"); });
        td.addEventListener("drop",function(e){ e.preventDefault(); td.classList.remove("drop-hot");
          var id=dragId||(e.dataTransfer&&e.dataTransfer.getData("text/plain")); if(id) moveItem(id,lane.id,d); });
        tr.appendChild(td);
      });
      gbody.appendChild(tr);
    });
    setEditable();
    applyMoveState();
    renderKpis();
  }

  function setEditable(){
    document.getElementById("grid").classList.toggle("editing",editing);
    gbody.querySelectorAll(".card .t,.card .nt").forEach(function(el){ el.contentEditable = editing?"true":"false"; });
  }

  function applyMoveState(){
    document.body.classList.toggle("move-mode",!!moving);
    gbody.querySelectorAll(".card").forEach(function(c){ c.classList.toggle("sel-move",c.dataset.id===moving); });
    moveCancelBtn.hidden=!moving;
  }

  function renderKpis(){
    var box=document.getElementById("kpis"); box.innerHTML="";
    var tiles=[["total",UI[lang].total,items.length]];
    LANES.forEach(function(l){ tiles.push([l.id,laneShort(l),items.filter(function(it){return it.lane===l.id;}).length]); });
    tiles.forEach(function(t){
      var d=document.createElement("div"); d.className="kpi"+(t[0]==="total"?" total":"");
      d.innerHTML='<div class="n">'+t[2]+'</div><div class="l">'+t[1]+'</div>'; box.appendChild(d);
    });
  }

  function renderLaneToggles(){
    var box=document.getElementById("laneToggles"); box.innerHTML="";
    LANES.forEach(function(l){
      var b=document.createElement("button"); b.className="chip"; b.setAttribute("aria-pressed",hidden[l.id]?"false":"true");
      b.innerHTML='<span class="dot" style="background:'+l.color+'"></span>'+laneShort(l);
      b.addEventListener("click",function(){ hidden[l.id]=!hidden[l.id]; saveLanes(); b.setAttribute("aria-pressed",hidden[l.id]?"false":"true"); render(); });
      box.appendChild(b);
    });
  }

  // 語言切換
  Array.prototype.forEach.call(document.querySelectorAll("#langtabs button"),function(b){
    b.addEventListener("click",function(){
      if(lang===b.dataset.lang) return;
      lang=b.dataset.lang; saveLang(); applyChrome(); renderLaneToggles(); render();
    });
  });

  moveCancelBtn.addEventListener("click",function(){ moving=null; applyMoveState(); });
  editBtn.addEventListener("click",function(){
    editing=!editing; this.classList.toggle("on",editing); this.setAttribute("aria-pressed",editing?"true":"false");
    document.getElementById("editHint").hidden=!editing; moving=null; render();
  });
  resetBtn.addEventListener("click",function(){
    items=seedItems(); hidden={}; moving=null; save(); saveLanes(); renderLaneToggles(); render();
  });
  copyBtn.addEventListener("click",function(){
    var T=UI[lang], lines=[T.copyHead];
    DAYS.forEach(function(d){
      var day=items.filter(function(it){return it.d===d;});
      if(!day.length) return;
      lines.push(T.dayHead(d,phaseLabel(phaseOf(d))));
      LANES.forEach(function(l){
        day.filter(function(it){return it.lane===l.id;}).forEach(function(it){
          lines.push("  ["+laneShort(l)+"] "+(it.t[lang]||"")+(it.nt[lang]?("　— "+it.nt[lang]):""));
        });
      });
    });
    var txt=lines.join("\n"), btn=this;
    function ok(){ var o=btn.textContent; btn.textContent=T.copied; setTimeout(function(){btn.textContent=o;},1400); }
    if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(txt).then(ok).catch(fb); } else fb();
    function fb(){ var ta=document.createElement("textarea"); ta.value=txt; ta.style.position="fixed"; ta.style.opacity="0";
      document.body.appendChild(ta); ta.select(); try{document.execCommand("copy");ok();}catch(e){} document.body.removeChild(ta); }
  });

  exportBtn.addEventListener("click",function(){
    var payload={ _note:"貼回對話給 Claude 以同步回 index.html 原始檔 / Paste to Claude to sync back into the source file",
      schema:"layaThaiSchedule_v4", updatedAt:new Date().toISOString(), hiddenLanes:hidden, items:items };
    var txt=JSON.stringify(payload,null,2), btn=this, T=UI[lang];
    function ok(){ var o=btn.textContent; btn.textContent=T.exported; setTimeout(function(){btn.textContent=o;},1600); }
    if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(txt).then(ok).catch(fb); } else fb();
    function fb(){ var ta=document.createElement("textarea"); ta.value=txt; ta.style.position="fixed"; ta.style.opacity="0";
      document.body.appendChild(ta); ta.select(); try{document.execCommand("copy");ok();}catch(e){} document.body.removeChild(ta); }
  });

  applyChrome(); renderLaneToggles(); render();
})();
</script>
